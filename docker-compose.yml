services:
  mysql:
    image: mysql:8.0
    container_name: context-dictionary-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: diary_root
      MYSQL_DATABASE: context_dictionary
      MYSQL_USER: diary
      MYSQL_PASSWORD: diary_pass
    ports:
      - "33060:3306"
    volumes:
      - dictionary_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdiary_root"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: context-dictionary-app
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      DATABASE_URL: "mysql://root:diary_root@mysql:3306/context_dictionary"
      PORT: "3210"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  dictionary_mysql_data:
